services:
  db:
    image: postgres:17-alpine
    container_name: auth_db
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - database:/var/lib/postgresql/data

volumes:
  database: 
